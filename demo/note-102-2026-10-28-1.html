/* ══════════════════════════════════════════════════════════════
   공통 뼈대 (모든 테마가 같은 마크업을 씀)
   ══════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html { overflow-x: hidden; }
body {
  overflow-x: hidden; background-color: var(--page); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; word-break: keep-all;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.tm { font-family: var(--f-time); font-variant-numeric: tabular-nums; }
svg.i { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }

/* ── 페이지 머리 ── */
.page-head {
  max-width: 1600px; margin: 0 auto; padding: 32px 32px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 18px 40px; align-items: end;
}
.page-head .kick { margin: 0 0 6px; font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }
.page-head h1 { margin: 0; font-family: var(--f-head); font-weight: var(--w-head); font-size: 32px; line-height: 1.2; letter-spacing: -.02em; }
.page-head .lede { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 50ch; }
.controls { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ctl { display: flex; align-items: flex-start; gap: 10px; }
.ctl-l { font-size: 12px; color: var(--ink-3); width: 30px; flex: none; padding-top: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.seg button {
  border: 1.5px solid var(--ink); background: var(--screen); color: var(--ink-2);
  padding: 5px 11px; font-size: 13px; font-weight: 600; border-radius: var(--r-btn); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--screen); }
.theme-note { margin: 0; font-size: 12.5px; color: var(--ink-2); max-width: 48ch; padding-left: 40px; }
.chip-ex { align-self: flex-start; margin-left: 40px; font-size: 11px; color: var(--ink-2); border: 1px dashed var(--ink-3); padding: 2px 8px; background: var(--screen); }

/* ── 프레임 띠 (옆으로 넘김) ── */
.band { max-width: 1600px; margin: 0 auto; }
.fnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 6px 32px 12px; }
.fnav::-webkit-scrollbar { display: none; }
.fnav button {
  flex: none; border: 1px solid var(--line-2); background: var(--screen); color: var(--ink-2);
  padding: 4px 10px; font-size: 12.5px; font-weight: 600; border-radius: var(--r-btn); white-space: nowrap;
}
.fnav button .tm { margin-right: 5px; color: var(--accent); font-weight: 700; }
.fnav button[aria-current="true"] { border-color: var(--ink); color: var(--ink); }
.strip {
  position: relative; display: flex; gap: 28px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scroll-padding: 0 32px; padding: 4px 32px 14px; scrollbar-width: thin;
}
.strip::after { content: ""; flex: 0 0 4px; }
.strip-dots { display: flex; gap: 6px; align-items: center; padding: 0 32px 40px; }
.strip-dots i { display: block; width: 7px; height: 7px; background: var(--line-2); border-radius: 4px; transition: width .15s; }
.strip-dots i.on { width: 20px; background: var(--accent); }
.strip-dots .hint { font-size: 11.5px; color: var(--ink-3); margin-left: 6px; }

.shot { margin: 0; flex: none; width: min(360px, calc(100vw - 56px)); scroll-snap-align: start; min-width: 0; }
.shot.wide { width: min(960px, calc(100vw - 32px)); }
.shot figcaption { display: flex; gap: 8px; align-items: baseline; margin: 0 0 10px; padding-left: 4px; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.shot figcaption b { color: var(--accent); font-weight: 700; }
.shot figcaption strong { color: var(--ink); font-weight: 700; }
.shot figcaption span { overflow: hidden; text-overflow: ellipsis; }

/* ── 휴대폰 틀 ── */
.phone { background: var(--bezel); border-radius: var(--phone-r); padding: 10px; box-shadow: 0 0 0 1px var(--bezel-edge); }
.screen {
  background: var(--screen); border-radius: calc(var(--phone-r) - 9px); height: var(--screen-h, 800px);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.sbar { display: flex; justify-content: space-between; align-items: center; padding: 11px 24px 2px; font-size: 12px; font-weight: 700; flex: none; }
.sbar svg { width: 24px; height: 11px; color: var(--ink-2); }
.appbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 16px 4px; min-height: 24px; flex: none; position: relative; }
.ex { font-size: 10px; font-weight: 700; color: var(--ink-2); border: 1px dashed var(--ink-3); padding: 0 5px; line-height: 16px; border-radius: 2px; white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font-size: 12.5px; font-weight: 700; color: var(--ink); }
.back svg { width: 16px; height: 16px; }

/* 구석의 작은 연결 표시 */
.conn { position: relative; font-size: 10.5px; color: var(--ink-3); }
.conn summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 2px 0; opacity: .85; white-space: nowrap; }
.conn summary::-webkit-details-marker { display: none; }
.conn summary::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.conn[open] summary { opacity: 1; }
.conn .pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 8; width: 210px;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-2);
  border-radius: var(--r); padding: 9px 11px; font-size: 11.5px; line-height: 1.5; white-space: normal;
}
.conn .pop b { color: var(--ink); }

.scr {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  padding: 2px 16px 6px; display: flex; flex-direction: column; gap: 8px;
}
.scr::-webkit-scrollbar { display: none; }
.scr > *, .pad-l > *, .pad-r > * { flex-shrink: 0; }

/* 아래 탭 */
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line-2); background: var(--sunk); padding: 0 6px 12px; }
.tab {
  background: none; border: 0; border-top: 3px solid transparent; margin-top: -1px; padding: 6px 0 0;
  display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--ink-3);
}
.tab svg { width: 20px; height: 20px; }
.tab .idx { display: none; font-size: 9px; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; border-top-color: var(--accent); }

/* ── 구역 머리 ── */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11px; color: var(--ink-3); padding-bottom: 3px; border-bottom: 1px solid var(--line-2); }
.sec-h b { font-family: var(--f-head); font-size: 13px; font-weight: 700; color: var(--ink); }
.sec-h span { text-align: right; }

/* ── 옆으로 넘기는 카드 ── */
.swipe {
  position: relative; display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 2px 16px 3px;
  scrollbar-width: none; align-items: stretch;
}
.swipe::-webkit-scrollbar { display: none; }
.swipe::after { content: ""; flex: 0 0 6px; }
.swipe > * { flex: 0 0 84%; scroll-snap-align: start; min-width: 0; }
.swipe.half > * { flex-basis: 44%; }
.swipe.wide > * { flex-basis: 90%; }
.dots { display: flex; gap: 4px; align-items: center; min-height: 6px; margin-top: -5px; }
.dots i { display: block; width: 5px; height: 5px; border-radius: 3px; background: var(--line-2); transition: width .15s, background .15s; }
.dots i.on { width: 14px; background: var(--ink); }

/* ── 카드 ── */
.card {
  --c: var(--line-2);
  background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r);
  padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.card-k { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-k b { font-family: var(--f-head); font-size: 13.5px; font-weight: 700; }
.card-k .eff { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.card .k { font-size: 10.5px; color: var(--ink-3); }
.card h4 { margin: 0; font-family: var(--f-head); font-size: 14px; line-height: 1.35; }
.card p { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.card.ask { border-style: dashed; border-width: 1.5px; }
.card.more { background: transparent; border-style: dashed; justify-content: center; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }

/* 상태 색 (카드·줄·블록이 같이 씀) */
.is-ok { --c: var(--ok); --cs: var(--ok-soft); }
.is-off { --c: var(--off); --cs: var(--off-soft); }
.is-extra { --c: var(--extra); --cs: var(--extra-soft); }
.is-online { --c: var(--online); --cs: var(--online-soft); }
.is-check { --c: var(--check); --cs: var(--check-soft); }
.is-exam { --c: var(--exam-bg); --cs: var(--sunk); }
.is-review { --c: var(--review); --cs: var(--review-soft); }
.is-free { --c: transparent; --cs: transparent; }

/* ── 상태 표시 ── */
.st {
  --c: var(--ink-2); --cs: transparent;
  display: inline-flex; align-items: center; gap: 4px; flex: none; white-space: nowrap;
  font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; color: var(--c); border-radius: 2px;
}
.st i { display: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.st.ok { --c: var(--ok); --cs: var(--ok-soft); }
.st.off { --c: var(--off); --cs: var(--off-soft); }
.st.extra { --c: var(--extra); --cs: var(--extra-soft); }
.st.online { --c: var(--online); --cs: var(--online-soft); }
.st.check { --c: var(--check); --cs: var(--check-soft); }
.st.exam { --c: var(--exam-ink); background: var(--exam-bg); }

/* 확정 · 추정 · 따르지 않음 */
.cf { display: inline-flex; align-items: center; gap: 4px; flex: none; white-space: nowrap; font-size: 10.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.cf.est { color: var(--check); }
.cf.no { color: var(--ink-3); }

/* ── 근거: 원문 인용 + 출처 ── */
.ev { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.q {
  margin: 0; padding: 5px 9px 6px 10px; border-left: 2px solid var(--ink); background: var(--quote-bg);
  font-family: var(--f-quote); font-size: 12.5px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere;
  quotes: "“" "”";
}
.q::before { content: open-quote; }
.q::after { content: close-quote; }
mark { background: none; color: inherit; font-weight: 700; }
.chip { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; font-size: 10.5px; color: var(--ink-3); line-height: 1.35; }
.note { font-size: 11px; color: var(--ink-3); margin: 0; line-height: 1.45; }

/* ── 버튼 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: var(--r-btn); line-height: 1.2; white-space: nowrap;
}
.btn svg { width: 13px; height: 13px; flex: none; }
.btn.sm { font-size: 11px; padding: 3px 8px; }
.btn.pri { background: var(--pri-bg); border-color: var(--pri-bg); color: var(--pri-ink); }
.btn.ghost { border-color: var(--line-2); color: var(--ink-2); }
.btn.wide { width: 100%; padding: 11px; font-size: 14px; flex: none; }
.lnk { border: 0; background: none; padding: 0; font-size: 11.5px; font-weight: 700; color: var(--accent); white-space: nowrap; }

/* ── 오늘: 날짜 머리 ── */
.dayhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.date { display: flex; align-items: flex-end; gap: 8px; min-width: 0; }
.dnum { font-size: 32px; line-height: .95; letter-spacing: -.03em; font-weight: 700; }
.dwd { font-family: var(--f-head); font-size: 14px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.dwd small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--ink-3); font-weight: 400; }
.dbadge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 7px; background: var(--dday-bg); color: var(--dday-ink); white-space: nowrap; border-radius: 2px; }
.dbadge .dn { font-size: 12px; }
.hero { margin: 0; font-family: var(--f-head); font-weight: var(--w-head); font-size: 16px; line-height: 1.3; letter-spacing: -.01em; }
.hero em { font-style: normal; color: var(--off); }
.title { margin: 0; font-family: var(--f-head); font-weight: var(--w-head); font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
.lead { margin: 0; font-size: 12px; color: var(--ink-2); }

/* ── 오늘: 시간표 줄 ── */
.slots { display: flex; flex-direction: column; }
.slot { --c: var(--line-2); --cs: transparent; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.slot .t { display: flex; flex-direction: column; font-size: 12px; line-height: 1.2; color: var(--ink-2); padding-top: 2px; }
.slot .t .tm { font-weight: 700; }
.slot .t small { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.slot .c { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row1 .name { font-family: var(--f-head); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row1 > :last-child:not(.name) { margin-left: auto; }
.meta { font-size: 11px; color: var(--ink-2); line-height: 1.4; }
.meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.slot.past .t, .slot.past .name, .slot.past .meta { opacity: .62; }
.slot.is-free { padding: 3px 0; }
.slot.is-free .c { font-size: 11px; color: var(--ink-3); }
.slot.is-review .name { font-size: 12.5px; }
.now-line { display: grid; grid-template-columns: 46px 1fr; gap: 0 10px; align-items: center; height: 0; position: relative; z-index: 2; }
.now-line .tm { font-size: 10px; font-weight: 700; color: var(--now); background: var(--screen); width: max-content; padding-right: 3px; transform: translateY(-50%); }
.now-line i { height: 2px; background: var(--now); transform: translateY(-50%); }

/* ── D-day ── */
.dn { display: inline-flex; align-items: center; font-family: var(--f-num); font-weight: 700; font-size: 20px; line-height: 1; white-space: nowrap; }
.dn b { font-weight: inherit; }
.dcard {
  --c: var(--line-2);
  background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r);
  padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.dcard.hot { --c: var(--exam-bg); }
.dcard .when { font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.dcard .what { font-family: var(--f-head); font-size: 12.5px; font-weight: 700; line-height: 1.3; }
.dcard .sub { font-size: 10.5px; color: var(--ink-2); line-height: 1.35; }

/* ── 일정: 주간 격자 ── */
.wk-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wk-title .tm { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.tt {
  display: grid; grid-template-columns: 24px repeat(5, minmax(0, 1fr)); grid-template-rows: 30px repeat(42, 7px);
  font-size: 10px; position: relative;
  background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 28px; background-position: 0 30px;
}
.tt .dh { grid-row: 1; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.1; padding-top: 2px; }
.tt .dh .tm { display: block; font-weight: 400; font-size: 10px; color: var(--ink-3); }
.tt .dh.today { color: var(--accent); }
.tt .dh.today .tm { color: inherit; }
.tt .hr { grid-column: 1; font-family: var(--f-time); font-size: 9px; color: var(--ink-3); line-height: 1; padding-top: 1px; }
.tt .col { grid-row: 2 / span 42; border-left: 1px solid var(--line); }
.tt .col.today { background: var(--accent-soft); }
.blk {
  --c: var(--line-2); --cs: var(--surface);
  margin: 1px; padding: 2px; overflow: hidden; min-width: 0; z-index: 1;
  display: flex; flex-direction: column; gap: 1px; line-height: 1.12;
  background: var(--cs); border: 1px solid var(--line-2); border-left: 3px solid var(--c); border-radius: calc(var(--r) / 2);
}
.blk.is-ok { --cs: var(--surface); }
.blk b { font-size: 9.5px; letter-spacing: -.04em; word-break: keep-all; overflow-wrap: anywhere; }
.blk small { font-size: 9px; color: var(--ink-2); white-space: nowrap; }
.blk.is-off { background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--off-soft) 4px 6px); border-color: var(--off); }
.blk.is-off b { text-decoration: line-through; text-decoration-color: var(--off); color: var(--ink-2); }
.blk.is-off small { color: var(--off); font-weight: 700; }
.blk.is-exam { background: var(--exam-bg); color: var(--exam-ink); border-color: var(--exam-bg); }
.blk.is-exam small { color: inherit; opacity: .85; }
.blk.is-check { border-style: dashed; border-left-style: solid; }
.blk.is-check small, .blk.is-extra small, .blk.is-online small { color: var(--c); font-weight: 700; }
.blk.is-review { background: var(--review-soft); color: var(--review); border: 0; border-left: 3px solid var(--review); font-size: 9px; font-weight: 700; justify-content: center; }
.blk.past { opacity: .6; }
.tt .nowmark { grid-column: 2; grid-row: 24; border-top: 2px solid var(--now); z-index: 3; position: relative; }
.tt .due { grid-column: 6; grid-row: 42 / span 2; border-top: 2px solid var(--ink); font-size: 9px; font-weight: 700; text-align: center; z-index: 2; line-height: 1.3; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; font-size: 10.5px; color: var(--ink-2); }
.legend .st { font-size: 10px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-left: 3px solid var(--review); background: var(--review-soft); outline: 1px solid var(--line-2); outline-offset: -1px; margin-right: 3px; vertical-align: -1px; }

/* ── 복습 ── */
.qcard {
  background: var(--surface); border: 1.5px solid var(--edge); border-radius: var(--r);
  padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 300px; position: relative;
}
.qn { font-size: 11px; font-weight: 700; color: var(--accent); }
.qq { margin: 0; font-family: var(--f-head); font-size: 15px; font-weight: 600; line-height: 1.5; padding-right: 54px; }
.ans { border-top: 1px dashed var(--line-2); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.qa { margin: 0; font-size: 14px; font-weight: 700; }
.qw { margin: 0; font-size: 12px; color: var(--ink-2); }
.reveal { margin-top: auto; align-self: flex-start; }
.self { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: auto; }
.self .btn { padding: 9px 2px; }
.self [data-g="no"] { border-color: var(--off); color: var(--off); }
.self [data-g="meh"] { border-color: var(--check); color: var(--check); }
.self [data-g="ok"] { border-color: var(--ok); color: var(--ok); }
.mark { position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 700; padding: 2px 6px; border: 2px solid currentColor; background: var(--surface); border-radius: 2px; }
.mark.ok { color: var(--ok); } .mark.meh { color: var(--check); } .mark.no { color: var(--off); }
.mode-note { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 11.5px; color: var(--ink-2); }
.todo-row { display: flex; gap: 8px; }
.mini { flex: 1; border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px 9px; background: var(--surface); }
.mini .tm { font-size: 12px; font-weight: 700; }
.mini p { margin: 0; font-size: 11.5px; color: var(--ink-2); }

/* ── 성적 ── */
.date-note { font-size: 10.5px; color: var(--ink-3); border: 1px dashed var(--ink-3); padding: 3px 8px; border-radius: 2px; }
.g-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
.g-h h3 { margin: 0; font-family: var(--f-head); font-weight: var(--w-head); font-size: 16px; }
.g-h .meta { white-space: nowrap; }
.target {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "k tv" "v tv"; align-items: center; gap: 0 10px;
  padding: 7px 10px; border: 1.5px solid var(--ink); border-radius: var(--r);
}
.target .k { grid-area: k; font-size: 10.5px; color: var(--ink-3); }
.target .tv { grid-area: tv; font-size: 28px; line-height: 1; font-weight: 700; white-space: nowrap; }
.target .tv small { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.target .v { grid-area: v; font-size: 12.5px; font-weight: 700; }
.score { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.score .n { font-size: 30px; line-height: 1; letter-spacing: -.03em; font-weight: 700; }
.score .of { font-family: var(--f-time); font-size: 13px; color: var(--ink-3); }
.score .pct { margin-left: auto; text-align: right; font-size: 11px; color: var(--ink-2); line-height: 1.35; }
.score .pct b { font-family: var(--f-num); color: var(--ink); font-size: 14px; }
.bar { position: relative; height: 10px; display: flex; border: 1px solid var(--ink); }
.bar .got { background: var(--ink); }
.bar .lost { background: repeating-linear-gradient(135deg, var(--ink-3) 0 2px, transparent 2px 5px); }
.bar .goalmk { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--accent); }
.ticks { position: relative; height: 12px; font-family: var(--f-time); font-size: 9.5px; color: var(--ink-3); }
.ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.ledger { width: 100%; border-collapse: collapse; font-size: 12px; }
.ledger th { text-align: left; font-weight: 500; font-size: 10px; color: var(--ink-3); border-bottom: 1.5px solid var(--ink); padding: 2px 3px 3px 0; }
.ledger th.r, .ledger td.r { text-align: right; padding-right: 0; }
.ledger td { border-bottom: 1px solid var(--line); padding: 4px 3px 4px 0; vertical-align: top; }
.ledger td small { color: var(--ink-3); font-size: 10px; margin-left: 3px; }
.ledger td.r { font-family: var(--f-time); white-space: nowrap; }
.ledger tr.need td { font-weight: 700; }
.ledger tr.empty td { color: var(--ink-3); }
.calc { font-family: var(--f-time); font-size: 10px; color: var(--ink-3); }
.fine { margin: 0; font-size: 10.5px; color: var(--ink-3); line-height: 1.45; }
.plain { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.plain li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.plain li span:last-child { color: var(--ink-3); text-align: right; }

/* ── 처음 설정 ── */
.steps { display: flex; gap: 4px; align-items: center; }
.steps i { display: block; width: 20px; height: 5px; border: 1px solid var(--ink-3); }
.steps i.done { background: var(--ink-3); }
.steps i.cur { background: var(--accent); border-color: var(--accent); width: 30px; }
.steps .tm { margin-left: 6px; font-size: 11px; color: var(--ink-3); }
.kicker { margin: 0; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.gpa { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.gpa .num { font-size: 36px; line-height: .95; font-weight: 700; letter-spacing: -.02em; }
.gpa .of { font-family: var(--f-time); font-size: 15px; color: var(--ink-3); }
.gpa small { flex-basis: 100%; font-size: 11px; color: var(--ink-2); }
.goalc .gc-h, .plan-h { display: flex; align-items: baseline; gap: 6px; }
.goalc .gc-h b, .plan-h b { font-family: var(--f-head); font-weight: var(--w-head); font-size: 15px; }
.goalc .cr, .plan-h .cr { font-size: 11px; color: var(--ink-3); }
.goalc .found { font-size: 11.5px; color: var(--ink-2); margin: 0; }
.goalc .gbig { font-size: 40px; line-height: 1; color: var(--accent); font-weight: 700; }
.gchips { display: flex; gap: 3px; }
.gchip {
  flex: 1 1 0; min-width: 0; height: 36px; border: 1.5px solid var(--line-2); background: var(--surface);
  border-radius: var(--r-btn); font-family: var(--f-num); font-size: 14px; font-weight: 700; color: var(--ink-2);
}
.gchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--screen); }
.gchip:disabled { cursor: default; flex: 0 0 52px; }
.goalc .then { margin: 0; font-size: 11.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 7px; margin-top: auto; }
.goalc .then b { color: var(--ink); }
.plan-h { border-bottom: 1px solid var(--line-2); padding-bottom: 5px; }
.plan-h .goal { margin-left: auto; font-family: var(--f-num); font-weight: 700; font-size: 12px; padding: 1px 7px; border: 1.5px solid var(--accent); color: var(--accent); white-space: nowrap; border-radius: 2px; }
.pl { list-style: none; margin: 0; padding: 0; }
.pl li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 6px; padding: 4px 0; font-size: 12px; line-height: 1.42; border-bottom: 1px solid var(--line); }
.pl li:last-child { border-bottom: 0; }
.pl li small { display: block; color: var(--ink-3); font-size: 10.5px; }
.pl .mk { font-family: var(--f-num); font-weight: 700; text-align: center; }
.pl li.ok .mk { color: var(--ok); }
.pl li.warn .mk { color: var(--off); }
.pl li.unk .mk { color: var(--check); }
.pl li .btn { margin-top: 4px; }
.pl li.flash { animation: flash 1.1s ease-out; }
@keyframes flash { from { background: var(--hl); } to { background: transparent; } }
.sum { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1.5px solid var(--ink); border-radius: var(--r); padding: 7px 10px; }
.sum .k { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
.sum .k small { display: block; color: var(--ink-3); font-size: 10px; }
.sum .num { font-size: 18px; font-weight: 700; white-space: nowrap; }
.nav-row { display: flex; gap: 8px; margin-top: auto; }
.nav-row .btn { padding: 10px 12px; font-size: 13px; }
.nav-row .btn.pri { flex: 1; font-size: 14px; }

/* ── 친구 나눔 미리 보기 ── */
.redact-count { display: flex; align-items: center; gap: 12px; }
.redact-count .num { font-size: 44px; line-height: .9; color: var(--accent); font-weight: 700; }
.redact-count .t { font-family: var(--f-head); font-weight: 700; font-size: 14px; line-height: 1.35; }
.redact-count .t small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 11.5px; color: var(--ink-2); }
.shc .k { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.shc .v { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; margin: 0; color: var(--ink); }
.shc .w { font-size: 10.5px; color: var(--ink-3); margin-top: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.shc.off .v { color: var(--ink-3); }
.rd { display: inline-block; background: var(--ink); color: var(--screen); font-size: 11px; font-weight: 700; padding: 0 4px; border-radius: 2px; line-height: 18px; margin: 0 1px; }
.rd-note { color: var(--off); font-weight: 700; }
.sw { position: relative; width: 36px; height: 20px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 10px; background: var(--line-2); transition: background .15s; pointer-events: none; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(16px); }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.out { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11.5px; color: var(--ink-3); }
.out span { font-size: 10.5px; padding: 1px 6px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.lock { display: flex; gap: 7px; font-size: 11.5px; color: var(--ink-2); align-items: flex-start; }
.lock svg { width: 14px; height: 14px; margin-top: 2px; color: var(--ink); flex: none; }

/* ── 패드 ── */
.pad { background: var(--bezel); border-radius: 26px; padding: 12px; box-shadow: 0 0 0 1px var(--bezel-edge); }
.pad-screen { background: var(--screen); border-radius: 15px; height: 740px; display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
.pad-top { display: flex; align-items: center; gap: 12px; padding: 9px 18px 8px; border-bottom: 1px solid var(--line-2); font-size: 12px; flex: none; }
.brand { display: flex; align-items: center; gap: 7px; font-family: var(--f-head); font-weight: var(--w-head); font-size: 14px; white-space: nowrap; }
.logo { display: grid; grid-template-columns: repeat(2, 6px); gap: 2px; }
.logo b { width: 6px; height: 6px; background: var(--accent); border-radius: calc(var(--r) / 3); }
.logo b:nth-child(2) { background: var(--ok); }
.logo b:nth-child(3) { background: var(--line-2); }
.logo b:nth-child(4) { background: var(--ink); }
.pad-top nav { display: flex; gap: 2px; margin-left: 6px; }
.pad-top nav span { padding: 3px 8px; color: var(--ink-3); }
.pad-top nav span.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
.pad-top .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pad-body { flex: 1; display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
.pad-l { border-right: 1px solid var(--line-2); overflow-y: auto; overflow-x: hidden; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.pad-r { overflow-y: auto; overflow-x: hidden; padding: 14px 22px 18px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.pad-l::-webkit-scrollbar, .pad-r::-webkit-scrollbar { display: none; }
.pad-r .swipe { margin: 0 -22px; padding-left: 22px; padding-right: 22px; scroll-padding: 0 22px; }
.pad-r .swipe > * { flex-basis: 300px; }
.slot.sel .c { box-shadow: inset 3px 0 0 var(--off); background: var(--off-soft); padding: 4px 6px 5px 9px; }
.slot.sel .t, .slot.sel .name, .slot.sel .meta { opacity: 1; }
.crumb { display: flex; gap: 4px 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-3); }
.d-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-head h3 { margin: 0; font-family: var(--f-head); font-weight: var(--w-head); font-size: 22px; line-height: 1.25; letter-spacing: -.01em; }
.d-head .st { font-size: 14px; padding: 5px 9px; }
.verdict { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.evc { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.evc.main { border: 1.5px solid var(--edge); }
.evc.lose { border-style: dashed; }
.evc.lose .q { border-left-color: var(--ink-3); color: var(--ink-2); }
.evc-k { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); font-weight: 600; }
.rank { display: grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid var(--ink); font-size: 11px; font-weight: 700; color: var(--ink); flex: none; border-radius: calc(var(--r) / 2); }
.evc.main .rank { background: var(--ink); color: var(--screen); }
.evc .lnk { align-self: flex-start; margin-top: auto; }
.evc.main .q { font-size: 14px; }
.ladder { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.ladder > div { padding: 6px 8px; border-right: 1px solid var(--line); font-size: 11.5px; min-width: 0; }
.ladder > div:last-child { border-right: 0; }
.ladder .n { font-family: var(--f-time); font-size: 10.5px; color: var(--ink-3); display: block; }
.ladder .s { font-weight: 600; display: block; line-height: 1.3; }
.ladder .r { color: var(--ink-3); display: block; font-size: 10.5px; margin-top: 2px; }
.ladder .hit { background: var(--off-soft); }
.ladder .hit .n, .ladder .hit .r { color: var(--off); font-weight: 700; }
.ladder .miss .r { color: var(--check); font-weight: 700; }
.effects { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.effects li { padding: 7px 10px; font-size: 12px; line-height: 1.45; color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.effects b { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 700; }

@container (max-width: 700px) {
  .pad-body { display: block; overflow-y: auto; scrollbar-width: none; }
  .pad-l { border-right: 0; border-bottom: 1.5px solid var(--line-2); overflow: visible; }
  .pad-r { overflow: visible; padding: 14px 16px 18px; }
  .pad-r .swipe { margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-padding: 0 16px; }
  .pad-r .swipe > * { flex-basis: 84%; }
  .pad-top nav { display: none; }
  .ladder { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ladder > div { border-bottom: 1px solid var(--line); }
  .effects { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .page-head { grid-template-columns: minmax(0, 1fr); padding: 22px 16px 12px; }
  .page-head h1 { font-size: 26px; }
  .page-head .lede { font-size: 14px; }
  .fnav { padding: 4px 16px 10px; }
  .strip { gap: 14px; padding: 4px 16px 12px; scroll-padding: 0 16px; }
  .strip-dots { padding: 0 16px 32px; }
  .pad { padding: 8px; border-radius: 18px; }
  .pad-screen { height: 780px; }
}
@media (prefers-reduced-motion: reduce) {
  .dots i, .strip-dots i, .sw span, .sw span::after { transition: none; }
  .pl li.flash { animation: none; }
}

/* ══════════════════════════════════════════════════════════════
   테마별 디자인 요소 (같은 마크업, 모양만 다르게)
   ══════════════════════════════════════════════════════════════ */

/* ── 학사 수첩: 모눈 · 잉크 선 · 도장 · 형광펜 ── */
[data-ui-theme="notebook"] body {
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
}
[data-ui-theme="notebook"] .tab .idx { display: block; font-family: var(--f-num); }
[data-ui-theme="notebook"] .tab[aria-current="page"] .idx { color: var(--accent); }
[data-ui-theme="notebook"] .sec-h { border-bottom-color: var(--ink); padding-top: 4px; }
[data-ui-theme="notebook"] .st.ok { color: var(--ink-2); padding-left: 0; }
[data-ui-theme="notebook"] .st.ok::before { content: "✓"; font-size: 12px; }
[data-ui-theme="notebook"] .st.off { border: 3px double var(--off); padding: 3px 6px 2px; letter-spacing: .14em; transform: rotate(-4deg); background: var(--off-soft); border-radius: 0; }
[data-ui-theme="notebook"] .st.extra { background: linear-gradient(transparent 18%, var(--extra-soft) 18% 88%, transparent 88%); }
[data-ui-theme="notebook"] .st.online { border-bottom: 2px solid var(--online); padding: 3px 1px 2px; border-radius: 0; }
[data-ui-theme="notebook"] .st.check { background: var(--check-soft); outline: 1px dashed var(--check); outline-offset: -1px; }
[data-ui-theme="notebook"] .st.exam { letter-spacing: .08em; border-radius: 0; }
[data-ui-theme="notebook"] .cf::before { content: ""; width: 7px; height: 7px; background: currentColor; }
[data-ui-theme="notebook"] .cf.est::before, [data-ui-theme="notebook"] .cf.no::before { background: none; border: 1px dashed currentColor; width: 6px; height: 6px; }
[data-ui-theme="notebook"] .q { border-left-color: var(--off); }
[data-ui-theme="notebook"] mark { background: linear-gradient(transparent 52%, var(--hl) 52%); font-weight: 600; }
[data-ui-theme="notebook"] .hero em { color: inherit; background: linear-gradient(transparent 55%, var(--hl) 55%); }
[data-ui-theme="notebook"] .dnum { font-size: 38px; font-weight: 400; }
[data-ui-theme="notebook"] .dbadge { border-radius: 0; }
[data-ui-theme="notebook"] .slot { gap: 0; padding: 0; }
[data-ui-theme="notebook"] .slot .t { border-right: 1px solid var(--line-2); padding: 6px 6px 5px 0; }
[data-ui-theme="notebook"] .slot .c { padding: 6px 0 6px 9px; }
[data-ui-theme="notebook"] .slot.is-free .c { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--hatch) 6px 7px); padding: 3px 9px; }
[data-ui-theme="notebook"] .slot.is-free .t { padding: 3px 6px 3px 0; }
[data-ui-theme="notebook"] .slot.is-review .c { border-left: 3px solid var(--review); background: var(--review-soft); padding-left: 8px; }
[data-ui-theme="notebook"] .now-line { gap: 0; }
[data-ui-theme="notebook"] .card.ask { border-color: var(--accent); }
[data-ui-theme="notebook"] .card.ask .k { color: var(--accent); font-family: var(--f-num); }
[data-ui-theme="notebook"] .dcard { border-width: 1.5px; }
[data-ui-theme="notebook"] .dcard.hot { background: var(--exam-bg); color: var(--exam-ink); border-color: var(--exam-bg); }
[data-ui-theme="notebook"] .dcard.hot .when, [data-ui-theme="notebook"] .dcard.hot .sub { color: inherit; opacity: .8; }
[data-ui-theme="notebook"] .tt { border-top: 1.5px solid var(--ink); border-left: 1px solid var(--line-2); background-image: linear-gradient(var(--line-2) 1px, transparent 1px); }
[data-ui-theme="notebook"] .tt .dh { border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--ink); background: var(--surface); text-align: left; padding-left: 4px; }
[data-ui-theme="notebook"] .tt .dh.today { background: var(--accent); color: var(--on-accent); }
[data-ui-theme="notebook"] .tt .col { border-left: 0; border-right: 1px solid var(--line-2); }
[data-ui-theme="notebook"] .tt .hr { border-right: 1px solid var(--line-2); padding-left: 2px; }
[data-ui-theme="notebook"] .blk { border: 1px solid var(--ink); }
[data-ui-theme="notebook"] .blk.is-off { border-color: var(--off); }
[data-ui-theme="notebook"] .blk.is-extra { background: var(--extra-soft); border-color: var(--extra); }
[data-ui-theme="notebook"] .blk.is-online { background: var(--online-soft); border-color: var(--online); }
[data-ui-theme="notebook"] .blk.is-check { background: var(--check-soft); border: 1px dashed var(--check); }
[data-ui-theme="notebook"] .blk.is-review { border: 0; border-left: 3px solid var(--review); }
[data-ui-theme="notebook"] .qcard {
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 12px 12px;
}
[data-ui-theme="notebook"] .qcard .qq, [data-ui-theme="notebook"] .qcard .ans { background: var(--surface); }
[data-ui-theme="notebook"] .mark { transform: rotate(-5deg); border-radius: 0; }
[data-ui-theme="notebook"] .ledger tr.need td { background: var(--hl); }
[data-ui-theme="notebook"] .ledger tr.need td:first-child { box-shadow: inset 3px 0 0 var(--check); padding-left: 6px; }
[data-ui-theme="notebook"] .target .tv { font-weight: 700; font-size: 26px; }
[data-ui-theme="notebook"] .d-head .st.off { font-size: 16px; padding: 5px 10px 4px; }
[data-ui-theme="notebook"] .ladder { border-color: var(--ink); }
[data-ui-theme="notebook"] .effects li { border-color: var(--ink); }
[data-ui-theme="notebook"] .shc .v .rd, [data-ui-theme="notebook"] .rd { border-radius: 0; }
[data-ui-theme="notebook"] .pad-top { border-bottom-color: var(--ink); }

/* ── 관제탑: 운행표 줄 · 신호점 · 왼쪽 색 띠 · 판 넘김 ── */
[data-ui-theme="board"] .page-head { border-bottom: 3px solid var(--ink); margin-bottom: 14px; }
[data-ui-theme="board"] .seg button[aria-pressed="true"] { background: var(--exam-bg); color: var(--exam-ink); border-color: var(--ink); }
[data-ui-theme="board"] .tab .idx { display: block; font-family: var(--f-num); }
[data-ui-theme="board"] .tab[aria-current="page"] { border-top-color: var(--exam-bg); }
[data-ui-theme="board"] .sec-h { border-bottom: 2px solid var(--ink); font-size: 10.5px; }
[data-ui-theme="board"] .sec-h b { font-size: 12.5px; letter-spacing: .02em; }
[data-ui-theme="board"] .st { font-size: 11.5px; padding: 4px 7px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent); }
[data-ui-theme="board"] .st i { display: block; }
[data-ui-theme="board"] .st.off { background: var(--off); color: var(--on-off); border-color: var(--off); }
[data-ui-theme="board"] .st.off i { animation: blink 1.4s steps(1) infinite; }
[data-ui-theme="board"] .st.exam { background: var(--exam-bg); color: var(--exam-ink); border-color: var(--exam-bg); }
[data-ui-theme="board"] .st.check { border-style: dashed; background: transparent; }
@keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .15; } }
[data-ui-theme="board"] .cf { padding: 3px 6px; border: 1.5px solid var(--ink); line-height: 1; }
[data-ui-theme="board"] .cf.est { border-style: dashed; border-color: var(--ink-3); color: var(--ink-2); }
[data-ui-theme="board"] .cf.no { border-style: dashed; border-color: var(--line-2); }

<script type="module">
const pdfjsLib = {GlobalWorkerOptions: {}, getDocument() { throw new Error('demo'); }};

const D = JSON.parse(document.getElementById('note-data').textContent);
const $ = s => document.querySelector(s);
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const DPR = () => Math.min(window.devicePixelRatio || 1, 3);
const MAXPX = 12e6;                              // 캔버스 한 장 픽셀 한도(아이패드 사파리 메모리)
const A4 = [595, 842];
const r1 = v => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- PDF
let pdf = null;
const pdfSize = {};
let pdfDefault = A4;
function refGeo(p) { const [W, H] = pdfSize[p.pdf] || pdfDefault; return {x0: 0, y0: 0, w: W, h: H, pw: W, ph: H}; }
function msg(t) { const m = $('#msg'); m.textContent = t; m.hidden = !t; }
async function openPdf() {
  if (!D.pdf) return;
  try {
    pdf = await pdfjsLib.getDocument({url: D.pdf, cMapUrl: './vendor/pdfjs/cmaps/', cMapPacked: true, isEvalSupported: false}).promise;
    const p1 = await pdf.getPage(1), v = p1.getViewport({scale: 1});
    pdfDefault = [v.width, v.height]; pdfSize[1] = pdfDefault;
  } catch (e) { pdf = null; msg('자료 PDF를 열 수 없어요. 파일이 옮겨졌는지 확인해 주세요.'); }
}
let Active = null;
function showZoom() { const z = $('#zval'); if (z && Active) z.textContent = Math.round(Active.z * 100) + '%'; }

// 캔버스 자리: c._f 는 맡은 칸(쪽 전체 또는 교과서 부분) 안에서의 비율 [x, y, 폭, 높이]. 확대 중에는 비율대로 늘였다가 다시 그린다
function place(c, R) {
  const f = c._f || [0, 0, 1, 1];
  Object.assign(c.style, {left: R[0] + f[0] * R[2] + 'px', top: R[1] + f[1] * R[3] + 'px', width: f[2] * R[2] + 'px', height: f[3] * R[3] + 'px'});
}

// ---------- 페이지 묶음 보기(교과서 쪽 · 노트 쪽 · 자료 읽기 공통)
class Viewer {
  constructor(sc, pages, geo, ink) {
    this.sc = sc; this.box = sc.querySelector('.nb-pages'); this.pages = pages; this.geo = geo; this.ink = ink;
    this.z = 1; this.els = []; this.timer = 0; this.sraf = 0;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      const el = e.target; el._vis = e.isIntersecting;
      if (el._vis && el._stale) this.render(el); else if (!el._vis) this.free(el);
    }), {root: sc, rootMargin: '120% 60%'});
    sc.addEventListener('scroll', () => {
      if (this.sraf) return;
      this.sraf = requestAnimationFrame(() => { this.sraf = 0; this.onScroll && this.onScroll(); this.follow(); });
    }, {passive: true});
  }
  base() { const W = Math.max(...this.pages.map(p => this.geo(p).w), 100); return Math.max(.1, (this.sc.clientWidth - 24) / W); }
  scale() { return this.base() * this.z; }
  build() {
    this.io.disconnect(); this.box.textContent = '';
    this.els = this.pages.map(p => {
      const el = document.createElement('div'); el.className = 'pg'; el._p = p;
      if (p.pdf) { const bg = document.createElement('canvas'); bg.className = 'bg'; el.appendChild(bg); }
      if (this.ink) { const c = document.createElement('canvas'); c.className = 'ink'; el.appendChild(c); }
      this.box.appendChild(el); this.io.observe(el); return el;
    });
    this.layout(true);
  }
  index(p) { return this.pages.indexOf(p); }
  size(el) {
    const s = this.scale(), g = this.geo(el._p), W = g.w * s, H = g.h * s;
    el.style.width = W + 'px'; el.style.height = H + 'px';
    const pr = [-g.x0 * s, -g.y0 * s, (g.pw || g.w) * s, (g.ph || g.h) * s];
    el.querySelectorAll('canvas').forEach(c => place(c, c.classList.contains('bg') ? pr : [0, 0, W, H]));
    el._stale = true;
  }
